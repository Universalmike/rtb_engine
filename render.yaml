services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: rtb-engine-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Set these manually in the Render dashboard after creating
      # your Supabase DB and Upstash Redis (see DEPLOYMENT.md)
      - key: DATABASE_URL
        sync: false          # Render won't auto-fill — you paste it manually
      - key: REDIS_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9

# No databases block — using Supabase (PostgreSQL) + Upstash (Redis) instead.
# Both are free and don't expire like Render's free DB tier.
